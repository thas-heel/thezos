<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10100f" />
  <meta name="description" content="THE ZOS. Not everything needs explaining. Something is taking shape." />
  <title>THE ZOS — Something is taking shape</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#10100f; --fg:#f2efe8; --muted:#a6a39b; --accent:#d4c4a0; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg); font-family:'DM Sans',sans-serif; overflow-x:hidden; }
    body:before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.12; z-index:1; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.19'/%3E%3C/svg%3E"); }
    .wrap { min-height:100svh; display:flex; flex-direction:column; padding:34px 5.2vw 26px; position:relative; isolation:isolate; }
    header { display:flex; align-items:center; justify-content:space-between; position:relative; z-index:2; }
    .wordmark { font-family:'Manrope',sans-serif; font-size:20px; letter-spacing:.22em; font-weight:600; text-decoration:none; color:var(--fg); }
    .wordmark span { color:var(--accent); }
    .top-note { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.2em; }
    main { flex:1; display:grid; place-items:center; position:relative; min-height:620px; }
    .orb-wrap { position:absolute; width:min(62vw,660px); aspect-ratio:1; left:50%; top:48%; transform:translate(-50%,-50%); z-index:-1; }
    .orb { position:absolute; inset:9%; border-radius:50%; background:radial-gradient(ellipse at 38% 29%, rgba(211,194,157,.23), rgba(115,102,78,.12) 24%, rgba(32,31,27,.18) 47%, rgba(16,16,15,0) 70%); filter:blur(3px); animation:breath 8s ease-in-out infinite alternate; }
    .ring { position:absolute; inset:15%; border:1px solid rgba(212,196,160,.13); border-radius:50%; transform:rotate(-28deg) scaleY(.42); animation:turn 32s linear infinite; }
    .ring.two { inset:5%; transform:rotate(42deg) scaleY(.52); border-color:rgba(212,196,160,.08); animation-duration:45s; animation-direction:reverse; }
    .spark { position:absolute; width:5px; height:5px; border-radius:50%; background:var(--accent); box-shadow:0 0 20px 5px rgba(212,196,160,.28); top:24%; left:24%; }
    .hero { width:min(850px,100%); text-align:center; padding:60px 0; position:relative; z-index:2; }
    .eyebrow { font-size:10px; letter-spacing:.34em; text-transform:uppercase; color:var(--accent); margin:0 0 30px; }
    h1 { font-family:'Manrope',sans-serif; font-size:clamp(48px,8.4vw,112px); font-weight:300; letter-spacing:-.075em; line-height:.99; margin:0; }
    h1 em { font-style:normal; color:var(--accent); }
    .sub { margin:30px auto 0; max-width:420px; color:#b9b5ac; font-size:clamp(14px,1.5vw,16px); line-height:1.8; font-weight:300; }
    .actions { margin-top:42px; display:flex; justify-content:center; align-items:center; gap:24px; }
    .link { display:inline-flex; align-items:center; gap:12px; color:var(--fg); text-decoration:none; text-transform:uppercase; letter-spacing:.18em; font-size:10px; padding:15px 0; border-bottom:1px solid rgba(212,196,160,.6); transition:gap .25s,color .25s; }
    .link:hover { gap:19px; color:var(--accent); }
    .arrow { font-size:17px; line-height:10px; font-weight:300; }
    .side-label { position:absolute; writing-mode:vertical-rl; color:#77746d; font-size:9px; letter-spacing:.23em; text-transform:uppercase; right:0; top:50%; transform:translateY(-50%); }
    footer { display:flex; justify-content:space-between; align-items:center; position:relative; z-index:2; gap:18px; color:#77746d; font-size:9px; letter-spacing:.16em; text-transform:uppercase; }
    footer a { color:inherit; text-decoration:none; transition:color .2s; } footer a:hover { color:var(--accent); }
    .status { display:flex; align-items:center; gap:9px; } .dot { width:5px; height:5px; background:var(--accent); border-radius:50%; box-shadow:0 0 10px rgba(212,196,160,.65); }
    @keyframes breath { from { transform:scale(.94); opacity:.68; } to { transform:scale(1.08); opacity:1; } }
    @keyframes turn { to { rotate:360deg; } }
    @media(max-width:600px) { .wrap{padding:25px 23px 22px;} .top-note{font-size:8px; letter-spacing:.13em;} .wordmark{font-size:17px;} main{min-height:calc(100svh - 120px);} .orb-wrap{width:105vw;} .hero{padding:40px 0 70px;} .eyebrow{font-size:9px; margin-bottom:25px;} .sub{max-width:300px; margin-top:24px;} .actions{margin-top:32px;} .side-label{display:none;} footer{font-size:8px; letter-spacing:.1em;} }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="wordmark" href="#top" aria-label="THE ZOS home">THE <span>ZOS</span></a>
      <div class="top-note">A new perspective is forming</div>
    </header>
    <main id="top">
      <div class="orb-wrap" aria-hidden="true"><div class="orb"></div><div class="ring"></div><div class="ring two"></div><div class="spark"></div></div>
      <section class="hero">
        <p class="eyebrow">Not everything needs explaining.</p>
        <h1>Something<br>is taking <em>shape.</em></h1>
        <p class="sub">The interesting things rarely announce themselves.<br>They simply arrive — when the time is right.</p>
        <div class="actions"><a class="link" href="mailto:info@thezosglobal.com?subject=I%27m%20curious%20about%20THE%20ZOS">Stay curious <span class="arrow">↗</span></a></div>
      </section>
      <div class="side-label">The beginning of something else</div>
    </main>
    <footer>
      <span>© 2026 THE ZOS</span>
      <span class="status"><i class="dot"></i> In the making</span>
      <a href="mailto:info@thezosglobal.com">Make contact ↗</a>
    </footer>
  </div>
</body>
</html>
